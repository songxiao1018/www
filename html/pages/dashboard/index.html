<!-- 学校竞赛获奖情况展示网页-->
<!-- 2024.12.02 -->

<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>学校竞赛获奖情况数据仪表盘</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="dashboard">
            <header class="dashboard-header">
                <h1>学校竞赛获奖情况数据仪表盘</h1>
            </header>
            
            <div class="dashboard-grid">
                <!-- 柱状折线图 -->
                <div class="panel panel-large">
                    <div class="panel-header">
                        <h2>历年奖状数据</h2>
                    </div>
                    <div class="panel-content" id="bar-line-chart" style="height: 400px;"></div>
                </div>

                <!-- 云图 -->
                <div class="panel">
                    <div class="panel-header">
                        <h2>奖状类别云图</h2>
                    </div>
                    <div class="panel-content" id="word-cloud" style="height: 400px;"></div>
                </div>

                <!-- 各类奖状数量 -->
                <div class="panel">
                    <div class="panel-header">
                        <h2>各类奖状数量</h2>
                    </div>
                    <div class="panel-content" id="pie-chart" style="height: 400px;"></div>
                </div>
            </div>
        </div>
    </body>
</html>
